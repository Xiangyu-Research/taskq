# all core tests (taskq self test; needs-gpu ones are skipped) and the example project check (taskq --project example check)
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          python -m pip install numpy pyyaml
          bash queue/install_pueue.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: lint
        run: |
          pip install ruff==0.14.14
          ruff check .
      - name: tests
        run: python3 bin/taskq self test -j 4 --out "$RUNNER_TEMP/taskq-test"
      - name: example project
        run: |
          mkdir -p ~/taskq-example/data
          python3 bin/taskq --project example check
      - name: test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taskq-test-logs
          path: ${{ runner.temp }}/taskq-test
